[package]
name = "smtp2http"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
color-eyre = "0.6.5"
config = "0.15.27"
mail-auth = "0.14.1"
rcgen = "0.14.10"
reqwest = "0.13.5"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["tracing", "net", "macros", "rt-multi-thread", "fs", "io-std", "signal", "time"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
