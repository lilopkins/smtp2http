name: Bump version on Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - next

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # A PAT/App token lets CI re-run on the pushed commit; GITHUB_TOKEN pushes don't trigger workflows.
          token: ${{ secrets.DEPENDABOT_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          get_version() {
            awk -F '"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/ {print $2; exit}'
          }
          current=$(get_version < Cargo.toml)
          base=$(git show "origin/${BASE_REF}:Cargo.toml" | get_version)
          if [ "$current" != "$base" ]; then
            echo "Version already changed ($base -> $current); nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          core=${base%%-*}
          IFS=. read -r major minor patch <<< "$core"
          new="${major}.${minor}.$((patch + 1))"
          sed -i -E "0,/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/s//version = \"${new}\"/" Cargo.toml
          echo "Bumping $base -> $new"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.lock
        if: steps.bump.outputs.changed == 'true'
        run: cargo update --workspace --offline || cargo update --workspace

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bumped version for dependency update"
          git push
